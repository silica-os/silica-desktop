name: silica_shell
description: The Silica shell in Flutter - Dock, menu bar, Faro, wallpaper; one component per process.
publish_to: none
version: 0.0.0

environment:
  sdk: ^3.9.0

dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_svg: ^2.3.0
  silica_ui:
    git:
      url: https://github.com/silica-os/silica-ui.git
      ref: v1.0.0-alpha.24

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  generate: true
