[package]
name = "silica-assets"
description = "The compiled, memory-mapped Silica system assets (silica.assets): reader, C ABI and compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "silica_assets"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "silica-assets-compile"
path = "src/bin/silica-assets-compile.rs"
required-features = ["compile"]

[features]
# The compiler (sources to silica.assets). Readers that only map the file turn it off with
# `default-features = false`.
default = ["compile"]
# Composes an `icon.assets` in light, dark, clear and tinted (the daemon, and the compiler for the
# app composites of silica.assets).
compose = ["dep:resvg", "dep:roxmltree", "dep:svgtypes"]
compile = ["compose", "dep:png", "dep:qoi", "dep:toml", "dep:serde_json"]

[dependencies]
memmap2 = "0.9"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
resvg = { version = "0.48", default-features = false, features = ["raster-images"], optional = true }
png = { version = "0.17", optional = true }
qoi = { version = "0.4", optional = true }
toml = { version = "0.9", optional = true }
roxmltree = { version = "0.21", optional = true }
svgtypes = { version = "0.16", optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
