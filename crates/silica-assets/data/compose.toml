# Composition rules of the generic file and the generic folder: the glyph and label boxes and
# metrics, the type to symbol and color map, the label rules, the folder symbol and engraving,
# and which layers the tint reaches. They belong to the thumbnail generator (docs/thumbnails.md),
# not to silica-icons, which only provides the layer files. This file is a build-time source:
# the compiler stores it in silica.assets (docs/assets-format.md) and nothing reads it at
# run time. Numbers are on the 1024 canvas. Seeded from silica-icons a8b2a27.

[file]
fallback = "unknown"
layers = [{ role = "back" }, { role = "glyph" }, { role = "front" }]

[file.glyph]
box = [262, 262, 500, 500]

[file.glyph.symbol]
sizes = [{ min_size = 128, weight = "light" }, { min_size = 64, weight = "regular" }, { min_size = 16, weight = "semibold" }]

[file.glyph.app_icon]
body = [303.67, 303.67, 416.67, 416.67]

[file.label]
font = "Inter"
size = 111.67
weight = 500
tracking = 0
box = [270.64, 763.7, 482.72, 136.04]
case = "upper"
max_chars = 5
max_width = 482.72
overflow = "shrink"
min_size = 32

[file.label_alone]
font = "Inter"
size = 175.53
weight = 900
tracking = 0
box = [219.08, 362.8, 585.84, 212.83]
case = "upper"
max_chars = 5
max_width = 585.84
overflow = "shrink"
min_size = 32

