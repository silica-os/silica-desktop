# Composition rules of the generic file and the generic folder: the glyph and label boxes and
# metrics, the label rules, the folder symbol and engraving, and which layers the tint reaches.
# They belong to the thumbnail generator (docs/thumbnails.md), not to silica-icons, which only
# provides the layer files. A file's glyph is never a symbol: it is the icon of the app that
# opens it (docs/thumbnails.md), so there is no type to symbol map here. This file is a
# build-time source: the compiler stores it in silica.assets (docs/assets-format.md) and nothing
# reads it at run time. Numbers are on the 1024 canvas. Seeded from silica-icons a8b2a27.

[file]
layers = [{ role = "back" }, { role = "glyph" }, { role = "front" }]

[file.glyph]
box = [262, 262, 500, 500]

[file.glyph.app_icon]
body = [303.67, 303.67, 416.67, 416.67]

[file.label]
font = "Inter"
size = 139.59
weight = 500
tracking = 0
color = "#5f636b"
box = [219.08, 744.5, 585.84, 170.05]
case = "upper"
max_chars = 5
max_width = 585.84
overflow = "shrink"
min_size = 32

[folder]
layers = [{ role = "back", tint = true }, { role = "middle", when = "not-empty" }, { role = "front", tint = true }]
tint_symbol = true

[folder.symbol]
box = [335.04, 415.04, 353.92, 353.92]
sizes = [{ min_size = 128, weight = "light", scale = 1 }, { min_size = 64, weight = "regular", scale = 1 }, { min_size = 32, weight = "semibold", scale = 1, highlight = false }, { min_size = 16, weight = "semibold", scale = 1.272, highlight = false }]

[folder.effect]
color = "#1a64c8"
opacity = 0.78
highlight = "#ffffff"
highlight_opacity = 0.5
offset = 4

[folder.tint]
luminance = [0.35, 0.85]
shade = 0.72
glow = 0.5

[folder.tint.labels]
red = "#f2382e"
orange = "#f98a17"
yellow = "#f5c400"
green = "#2fb350"
blue = "#2f7cf6"
purple = "#a052e0"
gray = "#8e8e93"

# The folder in the icon styles other than Default (silica-desktop#232). silica-icons has no
# dark or clear folder artwork (the generic folder is the same in every theme), so the three
# layers are recoloured by the same ramp rules as the labelled tints: per layer a base color (or
# the system accent, `accent = true`), the luminance of the drawn layer maps from `shade` times
# the base (at `luminance[0]`) to the base lightened by `glow` (at `luminance[1]`), and the layer
# is drawn at `opacity`. The folder's own tint colour replaces the accent and the base colour of
# every style but Clear, which is glass and has no colour of its own. `symbol` is the engraving:
# its colors and opacities, or, with `accent = true`, the folder effect's colours through the
# front layer's ramp and the accent.
#
# Values chosen by analogy with the app icons (icon-format.md, "Themes"; there is no measured
# folder in these styles): dark is graphite, tinted follows the labelled-tint ramp (dark form:
# deeper), clear light/dark is the app glass (white / graphite) drawn translucent so the
# wallpaper shows through the folder, as through the body of a clear app icon.
[folder.styles.dark]
back = { color = "#505056", luminance = [0.35, 0.85], shade = 0.6, glow = 0.0 }
middle = { color = "#a0a0a6", luminance = [0.35, 0.85], shade = 1.0, glow = 0.0 }
front = { color = "#78787e", luminance = [0.35, 0.85], shade = 0.6, glow = 0.0 }
symbol = { color = "#2a2a2e", highlight = "#ffffff", opacity = 0.8, highlight_opacity = 0.18 }

[folder.styles.clear]
back = { color = "#ffffff", luminance = [0.35, 0.85], shade = 0.78, glow = 0.0, opacity = 0.42 }
middle = { color = "#ffffff", luminance = [0.35, 0.85], shade = 1.0, glow = 0.0, opacity = 0.8 }
front = { color = "#ffffff", luminance = [0.35, 0.85], shade = 0.86, glow = 0.0, opacity = 0.55 }
symbol = { color = "#3c3c43", highlight = "#ffffff", opacity = 0.6, highlight_opacity = 0.5 }

[folder.styles.clear-dark]
back = { color = "#8e8e93", luminance = [0.35, 0.85], shade = 0.6, glow = 0.0, opacity = 0.45 }
middle = { color = "#d8d8de", luminance = [0.35, 0.85], shade = 1.0, glow = 0.0, opacity = 0.7 }
front = { color = "#c7c7cc", luminance = [0.35, 0.85], shade = 0.7, glow = 0.0, opacity = 0.5 }
symbol = { color = "#f2f2f7", highlight = "#000000", opacity = 0.7, highlight_opacity = 0.3 }

[folder.styles.tinted]
back = { accent = true, luminance = [0.35, 0.85], shade = 0.72, glow = 0.5 }
middle = { accent = true, luminance = [0.35, 0.85], shade = 0.92, glow = 0.92 }
front = { accent = true, luminance = [0.35, 0.85], shade = 0.72, glow = 0.5 }
symbol = { accent = true }

[folder.styles.tinted-dark]
back = { accent = true, luminance = [0.35, 0.85], shade = 0.4, glow = 0.1 }
middle = { accent = true, luminance = [0.35, 0.85], shade = 0.7, glow = 0.7 }
front = { accent = true, luminance = [0.35, 0.85], shade = 0.5, glow = 0.3 }
symbol = { accent = true }

[folder.folders]
HOME = "house"
DESKTOP = "display"
DOCUMENTS = "doc-text"
DOWNLOAD = "arrow-down-circle"
MUSIC = "music-note"
PICTURES = "photo"
VIDEOS = "film"
TEMPLATES = "doc-plus"
PUBLICSHARE = "share"
APPLICATIONS = "square-grid-2x2"
LIBRARY = "books-vertical"
SHARED = "person-2"
NETWORK = "network"

# Structural file types that get a system document foreground (silica-icons `files/system/<name>.svg`,
# drawn in the glyph box) when no app handles the type, before the unknown-extension sheet.
# `mime`: a MIME type or `major/*`, matched against the file's type and its parents; `ext`: an
# extension without the dot. A name without artwork in silica-icons is skipped.
[file.system]
executable = { mime = ["application/x-executable", "application/x-pie-executable", "application/x-sharedlib", "application/x-shellscript", "application/vnd.appimage", "application/x-msdos-program", "application/x-ms-dos-executable"], ext = ["appimage", "run", "exe"] }
archive = { mime = ["application/zip", "application/x-tar", "application/gzip", "application/x-bzip2", "application/x-xz", "application/zstd", "application/x-7z-compressed", "application/vnd.rar", "application/x-compressed-tar", "application/x-archive"], ext = ["zip", "tar", "gz", "bz2", "xz", "zst", "7z", "rar"] }
disk-image = { mime = ["application/x-iso9660-image", "application/x-raw-disk-image", "application/x-qemu-disk", "application/x-cd-image"], ext = ["iso", "img", "qcow2", "vmdk", "vdi"] }
link = { mime = ["application/x-desktop", "inode/symlink", "application/x-shortcut"], ext = ["desktop", "lnk"] }
package = { mime = ["application/x-rpm", "application/vnd.debian.binary-package", "application/vnd.flatpak", "application/vnd.flatpak.ref", "application/vnd.snap"], ext = ["rpm", "deb", "flatpak", "snap"] }
data = { mime = ["application/octet-stream"], ext = ["bin", "dat"] }
# The glyph of a file nobody opens (unknown extension, or none): chosen by the service, no patterns.
unknown = { mime = [], ext = [] }
