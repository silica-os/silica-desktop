# Source table of the aliases that silica-icons does not carry: which icon a desktop
# application id resolves to. The compiler fails if a target does not exist in the sources it
# compiles. (There is no type table: the icon of a file is the icon of the app that opens it,
# docs/thumbnails.md.)

# The app icons in silica.assets are the shell's own: the Launcher, Mission Control, Screenshot
# and the Silica mark. The icons of the other Silica apps live in each app's repository
# (`icon/`, docs/assets-format.md "App icons"). Sources without this key compile every app icon
# (the test fixtures do that).
shell_apps = ["apps", "mission-control", "screenshot", "silica"]

[app]
"dev.frascella.Apps" = "apps"
"dev.frascella.MissionControl" = "mission-control"
"dev.frascella.Screenshot" = "screenshot"
