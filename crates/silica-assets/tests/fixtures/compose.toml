# Composition rules of the test fixtures (a trimmed copy of data/compose.toml).

[file]
layers = [{ role = "back" }, { role = "glyph" }, { role = "front" }]

[file.glyph]
box = [262, 262, 500, 500]

[file.glyph.app_icon]
body = [303.67, 303.67, 416.67, 416.67]

[file.label]
font = "Inter"
size = 139.59
weight = 500
tracking = 0
color = "#5f636b"
box = [219.08, 744.5, 585.84, 170.05]
case = "upper"
max_chars = 5
max_width = 585.84
overflow = "shrink"
min_size = 32

[file.label_alone]
font = "Inter"
size = 175.53
weight = 900
tracking = 0
color = "#5f636b"
box = [219.08, 362.8, 585.84, 212.83]
case = "upper"
max_chars = 5
max_width = 585.84
overflow = "shrink"
min_size = 32

[folder]
layers = [{ role = "back", tint = true }, { role = "middle", when = "not-empty" }, { role = "front", tint = true }]
tint_symbol = true

[folder.symbol]
box = [335.04, 415.04, 353.92, 353.92]
sizes = [{ min_size = 128, weight = "light", scale = 1 }, { min_size = 64, weight = "regular", scale = 1 }, { min_size = 32, weight = "semibold", scale = 1, highlight = false }, { min_size = 16, weight = "semibold", scale = 1.272, highlight = false }]

[folder.effect]
color = "#1a64c8"
opacity = 0.78
highlight = "#ffffff"
highlight_opacity = 0.5
offset = 4

[folder.tint]
luminance = [0.35, 0.85]
shade = 0.72
glow = 0.5

[folder.tint.labels]
red = "#f2382e"
orange = "#f98a17"
yellow = "#f5c400"
green = "#2fb350"
blue = "#2f7cf6"
purple = "#a052e0"
gray = "#8e8e93"

[folder.folders]
HOME = "key"
DOCUMENTS = "gear"
