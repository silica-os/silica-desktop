[package]
name = "silica-bundle"
description = "Silica app bundles: minisign keys and signatures, manifests, .sxv disk images, .silicaapp archives"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "silica-bundle"
path = "src/main.rs"

[[bin]]
name = "silica-quarantine"
path = "src/bin/quarantine.rs"

[dependencies]
base64 = "0.22"
blake2 = "0.10"
crc32fast = "1"
ed25519-dalek = "2"
flate2 = "1"
getrandom = "0.3"
sha2 = "0.10"
silica-apps = { path = "../apps" }
toml = "0.9"
serde = { version = "1", features = ["derive"] }
rustix = { version = "1", features = ["fs"] }
