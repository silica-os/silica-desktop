[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/silica-os/silica-desktop"

[workspace.lints.rust]
# "deny" and not "forbid": the embedder's FFI and Ossido's EGL re-enable it, only there
# (cargo xtask unsafe).
unsafe_code = "deny"

# Never crash: see AGENTS.md. They are allowed in tests (clippy.toml).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unreachable = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"

# The asset compiler renders SVG and encodes images: slow in an unoptimized build, and the
# tests of silica-assets compile whole icon sets.
[profile.dev.package.silica-assets]
opt-level = 2

[profile.dev.package.resvg]
opt-level = 3

[profile.dev.package.usvg]
opt-level = 3

[profile.dev.package.tiny-skia]
opt-level = 3

[profile.dev.package.tiny-skia-path]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.qoi]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.xxhash-rust]
opt-level = 3

# The shell on Vetro (`crates/shell`, branch `vetro`) uses libvetro from the sibling vetro
# checkout, which takes this repository's protocols by git: they come from here instead.
[patch."https://github.com/silica-os/silica-desktop"]
silica-protocols = { path = "crates/protocols" }
silica-control = { path = "crates/control" }
